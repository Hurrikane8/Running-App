<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Cantillon Effect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Space+Grotesk:wght@700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0E1A2B;
    --teal: #1F6F78;
    --teal-light: #3FA7A3;
    --gold: #F4B942;
    --gold-glow: #FFD66B;
    --coral: #E8575A;
    --cream: #F3EDE2;
    --slate: #5B6B82;
    --font-head: "Space Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
    --font-label: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg);
    cursor: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #stage {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    display: block;
  }
  #stage * { cursor: none; }
  .head { font-family: var(--font-head); font-weight: 700; }
  .label { font-family: var(--font-label); font-weight: 600; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet" aria-label="The Cantillon Effect">
  <defs>
    <clipPath id="frame"><rect width="1080" height="1920"/></clipPath>
    <radialGradient id="gGlow">
      <stop offset="0" stop-color="#FFD66B" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F4B942" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F4B942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gDrop" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.35" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#F4B942"/>
    </radialGradient>
    <radialGradient id="gVignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#0E1A2B" stop-opacity="0"/>
      <stop offset="1" stop-color="#070E18" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="medClip"><ellipse cx="0" cy="0" rx="66" ry="80"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1080" height="1920" fill="#0E1A2B"/>
    <g id="particles"></g>
    <g id="cam">
      <g id="lPond"></g>
      <g id="lTitle"></g>
      <g id="lFx"></g>
      <g id="lTags"></g>
      <g id="lPeople"></g>
      <g id="lWallets"></g>
      <g id="lTop"></g>
    </g>
    <rect width="1080" height="1920" fill="url(#gVignette)" pointer-events="none"/>
    <g id="lText"></g>
    <g id="lSafe"></g>
  </g>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
'use strict';

/* =====================================================================
   0. CONFIG, PARAMS, PALETTE
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const P_T = Q.has('t') ? parseFloat(Q.get('t')) : null;
const P_SPEED = parseFloat(Q.get('speed')) || 1;
const P_VO = Q.get('vo') === '1';
const P_SAFE = Q.get('safe') === '1';
const P_SFX = Q.get('sfx') === '1';
const P_PAUSE = Q.get('pause') === '1';

const DUR = 78;                       // total runtime (s); final frame == frame 0
const W = 1080, H = 1920;
const C = {
  bg: '#0E1A2B', teal: '#1F6F78', teal2: '#3FA7A3', gold: '#F4B942', glow: '#FFD66B',
  coral: '#E8575A', cream: '#F3EDE2', slate: '#5B6B82', ink: '#0E1A2B', slate2: '#8796AB'
};
const FONT_HEAD = '"Space Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif';
const FONT_LABEL = '"Inter", "Helvetica Neue", Arial, system-ui, sans-serif';

const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
const f1 = n => (Math.round(n * 10) / 10);
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const rgbCache = {};
function mix(a, b, t) {
  const A = rgbCache[a] || (rgbCache[a] = hex2rgb(a));
  const B = rgbCache[b] || (rgbCache[b] = hex2rgb(b));
  t = clamp(t);
  return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
}
// deterministic pseudo-random
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
// periodic helper: integer cycles across the whole loop => identical at t=0 and t=DUR
const per = (t, cycles, ph = 0) => Math.sin(TAU * cycles * t / DUR + ph);

/* =====================================================================
   1. WORLD GEOMETRY
   ===================================================================== */
const PC = { x: 540, y: 1040 };        // pond centre
const SRC = { x: 540, y: 300 };        // money source / hero drop home
const HOOK = [{ x: 310, y: 1150 }, { x: 770, y: 1150 }];
const HOOK_S = 1.7, RIDE_S = 0.5, POND_S = 0.62, CHART_S = 0.36, PAN_S = 0.5;
const WALLET_TOP = HOOK.map(h => ({ x: h.x, y: 786 }));
const CH = { x0: 150, y0: 1330, w: 760, h: 620 };     // chart frame
const PIVOT = { x: 540, y: 1000 };                     // balance-scale pivot
const BEAM = 270;
const N = 161;                                         // points per morphable shape
const ARROW = { x0: 100, x1: 980, y: 560 };
const CURL_L = ARROW.x1 - ARROW.x0, CURL_R0 = CURL_L / TAU;
const ZONES = [140, 270];                              // inner zone rings (rim is outer)

/* =====================================================================
   2. GLOBAL STATE (tweened by the master timeline)
   ===================================================================== */
const S = {
  camS: 1, camFx: 540, camFy: 960, camAx: 540, camAy: 960,
  pondR: CURL_R0, tilt: 1, curl: 0, fill: 0,
  rippleR: 0, raisedR: 0, waveLead: 26,
  relax: 0, tipAmp: 0,
  bob: 0, shim: 0,
  splash: 0, flash: 0,
  arrowHead: 0,
  sil: 0, silY: 0, silRip: 0, yr1730: 0,
  // morph keyframe positions
  kRim: 0, kMid: 0, kIn: 0, kRip: 0, kWave: 0, kGap: 0, kDisk: 0,
  // hero drop
  drop: { x: SRC.x, y: SRC.y, s: 0.62, sx: 1, sy: 1, tip: 1, glow: 1 },
};
const coins = [0, 1].map(i => ({ x: HOOK[i].x, y: 0, s: 1, sx: 1, sy: 1, fall: 1 }));

/* =====================================================================
   3. SHAPE GENERATORS (all return N points)
   ===================================================================== */
const proj = (x, y) => [x, PC.y + (y - PC.y) * S.tilt];
function circ(cx, cy, r, tilted) {
  const P = new Array(N);
  for (let i = 0; i < N; i++) {
    const a = -Math.PI + TAU * i / (N - 1);            // start at bottom, clockwise
    const x = cx + r * Math.sin(a), y = cy - r * Math.cos(a);
    P[i] = tilted ? proj(x, y) : [x, y];
  }
  return P;
}
function linePts(ax, ay, bx, by) {
  const P = new Array(N);
  for (let i = 0; i < N; i++) { const u = i / (N - 1); P[i] = [lerp(ax, bx, u), lerp(ay, by, u)]; }
  return P;
}
function point(x, y) { const P = new Array(N); for (let i = 0; i < N; i++) P[i] = [x, y]; return P; }
function polyPts(V) {   // closed polygon, arc-length parametrised, starts at V[0]
  const segs = []; let L = 0;
  for (let i = 0; i < V.length; i++) {
    const a = V[i], b = V[(i + 1) % V.length];
    const l = Math.hypot(b[0] - a[0], b[1] - a[1]); segs.push([a, b, l]); L += l;
  }
  const P = new Array(N);
  for (let i = 0; i < N; i++) {
    let d = L * i / (N - 1), j = 0;
    while (j < segs.length - 1 && d > segs[j][2]) { d -= segs[j][2]; j++; }
    const [a, b, l] = segs[j]; const u = l ? clamp(d / l) : 0;
    P[i] = [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
  }
  return P;
}
function rectPts(x0, y0, x1, y1) { const cx = (x0 + x1) / 2; return polyPts([[cx, y1], [x0, y1], [x0, y0], [x1, y0], [x1, y1]]); }

// hook lines
function leftLine() { return linePts(WALLET_TOP[0].x, WALLET_TOP[0].y, SRC.x, SRC.y); }
let _wind = null;
function winding() {
  if (_wind) return _wind;
  const a = SRC, b = WALLET_TOP[1];
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
  const d = [dx / L, dy / L], n = [-d[1], d[0]];
  // dense raw curve: serpentine + loops, then resample by arc length
  const raw = [];
  for (let i = 0; i <= 1200; i++) {
    const u = i / 1200, env = Math.pow(Math.sin(Math.PI * u), 0.6);
    const serp = 150 * Math.sin(3 * Math.PI * u) * env;
    const th = TAU * 4 * u, r = 34 * env;
    const along = L * u + r * Math.sin(th);
    const side = serp + r * (1 - Math.cos(th)) * 0.9;
    raw.push([a.x + d[0] * along + n[0] * side, a.y + d[1] * along + n[1] * side]);
  }
  const cum = [0];
  for (let i = 1; i < raw.length; i++) cum.push(cum[i - 1] + Math.hypot(raw[i][0] - raw[i - 1][0], raw[i][1] - raw[i - 1][1]));
  const tot = cum[cum.length - 1], P = new Array(N); let j = 0;
  for (let i = 0; i < N; i++) {
    const s = tot * i / (N - 1);
    while (j < raw.length - 2 && cum[j + 1] < s) j++;
    const u = clamp((s - cum[j]) / ((cum[j + 1] - cum[j]) || 1));
    P[i] = [lerp(raw[j][0], raw[j + 1][0], u), lerp(raw[j][1], raw[j + 1][1], u)];
  }
  return (_wind = P);
}
// arrow that bends down and curls into a closed circle centred on the pond
function curlPts() {
  const k = S.curl, kap = k / CURL_R0;
  const mx = 540, my = lerp(ARROW.y, PC.y - CURL_R0, gsap.parseEase('power2.inOut')(k));
  const P = new Array(N);
  for (let i = 0; i < N; i++) {
    const s = -CURL_L / 2 + CURL_L * i / (N - 1);
    if (kap < 1e-5) P[i] = [mx + s, my];
    else { const th = kap * s; P[i] = [mx + Math.sin(th) / kap, my + (1 - Math.cos(th)) / kap]; }
  }
  return P;
}
// chart curves
function goldF(u) {
  const steep = (1 - Math.exp(-4.2 * u)) / (1 - Math.exp(-4.2));
  return lerp(0.86 * steep, 0.47 * Math.pow(u, 0.9), S.relax);
}
function slateF(u) { return lerp(0.33 * smooth(0.4, 1, u), 0.43 * Math.pow(u, 1.05), S.relax); }
const chartPt = (fn, u) => [CH.x0 + CH.w * u, CH.y0 - CH.h * fn(u)];
function curvePts(fn) { const P = new Array(N); for (let i = 0; i < N; i++) P[i] = chartPt(fn, i / (N - 1)); return P; }
function gapPts() {
  const P = new Array(N), h = Math.ceil(N / 2);
  for (let i = 0; i < h; i++) P[i] = chartPt(goldF, i / (h - 1));
  for (let i = h; i < N; i++) P[i] = chartPt(slateF, 1 - (i - h + 1) / (N - h));
  return P;
}
// balance scale
function tipAngle() { return S.tipAmp * 0.13 * Math.sin(TAU * curT / 2.6) * (0.8 + 0.2 * Math.sin(TAU * curT / 5.3)); }
function beamEnds() {
  const th = tipAngle(), c = Math.cos(th) * BEAM, s = Math.sin(th) * BEAM;
  return [[PIVOT.x - c, PIVOT.y - s], [PIVOT.x + c, PIVOT.y + s]];
}
function beamPts() { const [a, b] = beamEnds(); return linePts(a[0], a[1], b[0], b[1]); }
function panPts(side) {
  const E = beamEnds()[side], ex = E[0], ey = E[1];
  const n1 = 20, n3 = 20, n2 = N - n1 - n3, P = [];
  const L = [ex - 72, ey + 118], R = [ex + 72, ey + 118];
  for (let i = 0; i < n1; i++) { const u = i / n1; P.push([lerp(ex, L[0], u), lerp(ey, L[1], u)]); }
  for (let i = 0; i < n2; i++) { const t = Math.PI * i / (n2 - 1); P.push([ex - 72 * Math.cos(t), ey + 118 + 36 * Math.sin(t)]); }
  for (let i = 1; i <= n3; i++) { const u = i / n3; P.push([lerp(R[0], ex, u), lerp(R[1], ey, u)]); }
  return P;
}
const PAN_COIN = [[PIVOT.x - BEAM, PIVOT.y + 132], [PIVOT.x + BEAM, PIVOT.y + 132]];

/* =====================================================================
   4. MORPHING ELEMENTS (keyframed shapes + styles)
   ===================================================================== */
const lPond = $('lPond');
const M = {};
function morph(name, kKey, shapes, styles, fillMode, parent) {
  const e = el('path', { fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent || lPond);
  M[name] = { e, kKey, shapes, styles, fillMode, last: '' };
}
function lerpPts(A, B, t) {
  if (t <= 0) return A; if (t >= 1) return B;
  const P = new Array(N);
  for (let i = 0; i < N; i++) P[i] = [A[i][0] + (B[i][0] - A[i][0]) * t, A[i][1] + (B[i][1] - A[i][1]) * t];
  return P;
}
function toPath(P, close) {
  let d = 'M' + f1(P[0][0]) + ',' + f1(P[0][1]);
  for (let i = 1; i < P.length; i++) d += 'L' + f1(P[i][0]) + ',' + f1(P[i][1]);
  return close ? d + 'Z' : d;
}
function renderMorph(m) {
  const k = S[m.kKey], n = m.shapes.length;
  const i = Math.min(Math.floor(k), n - 2), f = clamp(k - i);
  const sa = m.styles[i], sb = m.styles[i + 1];
  const w = lerp(sa.w, sb.w, f), o = lerp(sa.o, sb.o, f);
  if (o < 0.004 || (!m.fillMode && w < 0.05)) { m.e.setAttribute('display', 'none'); return; }
  m.e.removeAttribute('display');
  const P = f <= 0 ? m.shapes[i]() : f >= 1 ? m.shapes[i + 1]() : lerpPts(m.shapes[i](), m.shapes[i + 1](), f);
  m.e.setAttribute('d', toPath(P, m.fillMode));
  const col = mix(sa.c, sb.c, f);
  if (m.fillMode) {
    m.e.setAttribute('fill', col); m.e.setAttribute('fill-opacity', o.toFixed(3));
    if (w > 0.05) { m.e.setAttribute('stroke', mix(sa.sc || sa.c, sb.sc || sb.c, f)); m.e.setAttribute('stroke-width', w.toFixed(2)); }
    else m.e.setAttribute('stroke', 'none');
  } else {
    m.e.setAttribute('stroke', col); m.e.setAttribute('stroke-width', w.toFixed(2)); m.e.setAttribute('stroke-opacity', o.toFixed(3));
  }
}
const st = (c, w, o = 1, sc) => ({ c, w, o, sc });
const HID = st(C.gold, 0, 0);

// The pond water body -> chart baseline -> scale base -> gone
morph('disk', 'kDisk', [
  () => point(540, PC.y),
  () => circ(540, PC.y, CURL_R0 * S.fill, false),
  () => circ(PC.x, PC.y, S.pondR, true),
  () => rectPts(CH.x0, CH.y0, CH.x0 + CH.w, CH.y0 + 16),
  () => rectPts(430, 1322, 650, 1340),
  () => point(540, 1330),
], [st(C.teal, 0, 1), st(C.teal, 0, 1), st(C.teal, 0, 1), st(C.teal, 0, 1), st(C.slate, 0, 1), st(C.slate, 0, 0)], true);

// Raised water behind the money ripple -> coral gap -> fulcrum -> gone
morph('gap', 'kGap', [
  () => circ(PC.x, PC.y, 0.01, true),
  () => circ(PC.x, PC.y, S.raisedR, true),
  () => gapPts(),
  () => polyPts([[540, 1072], [492, 1072], [540, 1000], [588, 1072]]),
  () => point(540, 1000),
], [st(C.teal2, 0, 0.0), st(C.teal2, 0, 0.42), st(C.coral, 0, 0.62), st(C.slate2, 0, 1), st(C.slate2, 0, 0)], true);

// shimmer group lives between water and rings
const lShim = el('g', {}, lPond);

// Middle zone ring: hook short line -> retract -> silhouette ripple -> zone ring -> y-axis -> pillar -> hook short line
morph('mid', 'kMid', [
  () => leftLine(),
  () => point(SRC.x, SRC.y),
  () => point(SIL.x, SIL.y),
  () => circ(SIL.x, SIL.y, 105, false),
  () => circ(PC.x, PC.y, ZONES[1], true),
  () => linePts(CH.x0, CH.y0, CH.x0, CH.y0 - CH.h),
  () => linePts(540, 1330, PIVOT.x, PIVOT.y),
  () => leftLine(),
], [st(C.gold, 5), st(C.gold, 0, 0), st(C.teal2, 0, 0), st(C.teal2, 5, 0.9), st(C.teal2, 3, 0.45), st(C.slate2, 5, 1), st(C.cream, 12, 1), st(C.gold, 5)]);

// Inner zone ring -> gold "assets" line -> left pan -> coin -> gone
morph('in', 'kIn', [
  () => point(SIL.x, SIL.y),
  () => circ(SIL.x, SIL.y, 60, false),
  () => circ(PC.x, PC.y, ZONES[0], true),
  () => curvePts(goldF),
  () => panPts(0),
  () => circ(PAN_COIN[0][0], PAN_COIN[0][1], 30, false),
  () => circ(PAN_COIN[0][0], PAN_COIN[0][1], 30, false),
], [st(C.teal2, 0, 0), st(C.teal2, 4, 0.9), st(C.teal2, 3, 0.45), st(C.gold, 9), st(C.gold, 6), st(C.gold, 6), st(C.gold, 0, 0)]);

// Coral price wave ring -> collapses into the top edge of the gap
morph('wave', 'kWave', [
  () => circ(PC.x, PC.y, 0.01, true),
  () => circ(PC.x, PC.y, S.rippleR + S.waveLead, true),
  () => curvePts(goldF),
], [st(C.coral, 0, 0), st(C.coral, 5, 0.95), st(C.coral, 0, 0)]);

// Gold money ripple -> slate "wages" line -> right pan -> coin -> gone
morph('rip', 'kRip', [
  () => circ(PC.x, PC.y, 0.01, true),
  () => circ(PC.x, PC.y, S.rippleR, true),
  () => curvePts(slateF),
  () => panPts(1),
  () => circ(PAN_COIN[1][0], PAN_COIN[1][1], 30, false),
  () => circ(PAN_COIN[1][0], PAN_COIN[1][1], 30, false),
], [st(C.gold, 0, 0), st(C.gold, 8, 1), st(C.slate2, 9), st(C.gold, 6), st(C.gold, 6), st(C.gold, 0, 0)]);

// THE thread: winding hook line -> timeline arrow -> curl -> pond rim -> x-axis -> scale beam -> winding hook line
morph('rim', 'kRim', [
  () => winding(),
  () => curlPts(),
  () => circ(PC.x, PC.y, S.pondR, true),
  () => linePts(CH.x0, CH.y0, CH.x0 + CH.w, CH.y0),
  () => beamPts(),
  () => winding(),
], [st(C.gold, 5), st(C.gold, 7), st(C.teal2, 6), st(C.slate2, 6), st(C.cream, 14), st(C.gold, 5)]);
const arrowHead = el('path', { fill: C.gold, d: 'M0,-20 L34,0 L0,20 Z' }, lPond);

// silhouette position on the pond rim (scene 2)
const SIL = { x: 540 - 330 * Math.sin(0.44), y: PC.y - 330 * Math.cos(0.44) };

/* =====================================================================
   5. AMBIENT: particles + water shimmer
   ===================================================================== */
const parts = [];
for (let i = 0; i < 26; i++) {
  const c = el('circle', { r: (1.5 + rnd(i) * 3.5).toFixed(1), fill: i % 5 === 0 ? C.gold : C.cream }, $('particles'));
  parts.push({ c, x0: rnd(i + 3) * W, y0: rnd(i + 7) * H, cyc: 1 + Math.floor(rnd(i + 11) * 3), sw: 10 + rnd(i + 13) * 30, swc: 3 + Math.floor(rnd(i + 17) * 6), ph: rnd(i + 19) * TAU, o: 0.08 + rnd(i + 23) * 0.22 });
}
const shims = [];
for (let i = 0; i < 9; i++) {
  const p = el('path', { fill: 'none', stroke: C.teal2, 'stroke-width': 3, 'stroke-linecap': 'round' }, lShim);
  shims.push({ p, r: 0.18 + 0.75 * rnd(i + 40), a0: rnd(i + 41) * TAU, len: 0.25 + rnd(i + 42) * 0.35, cyc: (i % 3) + 1, dir: i % 2 ? 1 : -1, ph: rnd(i + 43) * TAU });
}

/* =====================================================================
   6. SCENE-2 PROPS: title letters, silhouette medallion, paper notes
   ===================================================================== */
const lTitle = $('lTitle');
const titleRows = [];   // built after fonts load
const medal = el('g', {}, lTitle);
const silRing = el('ellipse', { fill: 'none', stroke: C.teal2, 'stroke-width': 4 }, medal);
const medalInner = el('g', {}, medal);

    if (total > maxW) { const k = maxW / total; size *= k; widths = widths.map(w => w * k); total = maxW; }
    if (li > 0) y += size * 0.5 + (ln.gap || 16);

const sfx = (() => {
  let ac = null, lastTick = 0;
  const ok = () => P_SFX && ac && ac.state === 'running' && tl && !tl.paused();
  function unlock() { if (!P_SFX) return; if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); }
  function tone(f0, f1_, dur, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1_, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  return {
    unlock,
    plip() { if (ok()) { tone(900, 220, 0.35, 'sine', 0.35); tone(1800, 600, 0.12, 'triangle', 0.08); } },
    shimmer() { if (ok()) for (let i = 0; i < 6; i++) setTimeout(() => ok() && tone(700 + i * 160, 900 + i * 200, 0.5, 'sine', 0.05), i * 90); },
    tick() { if (!ok()) return; const n = performance.now(); if (n - lastTick < 55) return; lastTick = n; tone(2400, 2000, 0.03, 'square', 0.03); },
    pop() { if (ok()) tone(500, 900, 0.08, 'sine', 0.06); },
  };
})();

}

/* =====================================================================
   17. BOOT
   ===================================================================== */
render();
function start() {
  build();
  tl.timeScale(P_SPEED);
  if (P_T !== null && !isNaN(P_T)) tl.seek(Math.max(0, Math.min(DUR, P_T)), true);
  if (!P_PAUSE) tl.play();
  gsap.ticker.add(render);
  render();
  window.__tl = tl; window.__render = () => render();
  window.__ready = true;
}
const fontsReady = Promise.all([
  document.fonts.load('700 100px "Space Grotesk"'),
  document.fonts.load('600 40px "Inter"'),
  document.fonts.load('500 40px "Inter"'),
]).then(() => document.fonts.ready);
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(start, start);

// single tap anywhere restarts (also unlocks optional audio)
window.addEventListener('pointerdown', () => {
  sfx.unlock();
  if (!tl) return;
  if (P_VO && 'speechSynthesis' in window) speechSynthesis.cancel();
  tl.restart(); tl.play();
});
})();
